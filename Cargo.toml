[package]
name = "sth-plex-pip"
version = "0.1.0"
edition = "2024"
description = "A floating, click-through Plex picture-in-picture player"
license = "MIT"
repository = "https://github.com/SeeThruHead/sth-plex-pip"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_glow = "0.37"
glutin = "0.32"
libmpv2 = { version = "7", features = ["render"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = "0.21"
wayland-backend = { version = "0.3", features = ["client_system"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
egui-winit = { version = "0.37", default-features = false }
global-hotkey = "0.10"
glutin-winit = "0.5"
winit = "0.30"

[profile.release]
lto = "thin"
strip = true
